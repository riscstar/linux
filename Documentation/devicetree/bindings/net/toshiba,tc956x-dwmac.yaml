%YAML 1.2
---
$id: http://devicetree.org/schemas/net/toshiba,tc956x-dwmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC956x Ethernet-AVB/TSN Controller

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The Toshiba TC9564 (and more generally, TC956x) incorporates a PCIe
  gen 3 switch with one upstream and three downstream ports.  The first
  two downstream ports are exposed externally, while the third is used
  by an internal PCIe endpoint.  The PCIe endpoint implements two PCIe
  functions, and attached to each of these is a 10 Gbps capable Synopsys
  Ethernet controller.

  The TC956x additionally implements other internal IP blocks, and in
  particular it implements a GPIO controller.  Ten of the 35 GPIO lines
  implemented are exposed externally and are usable by the platform.

properties:
  compatible:
    enum:
      - pci1179,0220 # Toshiba TC9564 (a.k.a. Qualcomm QPS615)

  "#gpio-cells":
    const: 2

  gpio-controller: true

  # We can't allOf reference ethernet-controller.yaml because we end up with
  # contradictory $nodename rules (`ethernet@` versus `pci@`). Happily only a
  # small number of the properties are useful on TC956x so we can just reference
  # what we need.
  phy-connection-type:
    $ref: ethernet-controller.yaml#/properties/phy-connection-type

  phy-handle:
    $ref: ethernet-controller.yaml#/properties/phy-handle

  phy-mode:
    $ref: ethernet-controller.yaml#/properties/phy-mode

  mdio:
    $ref: snps,dwmac.yaml#/properties/mdio

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/pci/pci-bus-common.yaml#
  - $ref: /schemas/pci/pci-device.yaml#

unevaluatedProperties: false

examples:
  - |
    pcie {
      #address-cells = <3>;
      #size-cells = <2>;

      tc956x_emac0: pci@0,0 {
        compatible = "pci1179,0220";
        reg = <0x50000 0x0 0x0 0x0 0x0>;
        #address-cells = <3>;
        #size-cells = <2>;
        device_type = "pci";
        ranges;

        gpio-controller;
        #gpio-cells = <2>;

        phy-mode = "10gbase-r";
        phy-handle = <&tc956x_emac0_phy>;

        mdio {
          compatible = "snps,dwmac-mdio";
          #address-cells = <1>;
          #size-cells = <0>;

          tc956x_emac0_phy: ethernet-phy@1c {
            compatible = "ethernet-phy-id311c.1c12";
            reg = <0x1c>;
          };
        };
      };
    };
